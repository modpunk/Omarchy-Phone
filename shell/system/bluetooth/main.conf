# /etc/bluetooth/main.conf: bluetoothd defaults for the phone (F5 in the
# security review). Not discoverable/pairable by default -- pairing mode is
# something the (future) Bluetooth settings tile turns on for a bounded time,
# not the device's resting state. This does NOT replace ophone-btagentd: a
# NoInputNoOutput fallback agent honors these settings too, but still
# auto-accepts Just Works with no confirmation. The agent (F5/F6, requiring
# an explicit Pair/Reject tap) is the actual fix; this file just shrinks the
# window an attacker has to try in the first place.
[General]
Name = Omarchy Phone
DiscoverableTimeout = 0
Discoverable = false
PairableTimeout = 180
Pairable = false
# Reject legacy just-works re-pairing of an already-bonded, now out-of-band
# address (a downgrade some MITM tools rely on).
JustWorksRepairing = never
# Use a resolvable private address for LE advertising/scanning instead of the
# fixed hardware one (F10-adjacent; independent of the Wi-Fi cutover, and
# correct for BLE scanning today).
Privacy = device

[Policy]
AutoEnable = true
