# Install to /usr/lib/tmpfiles.d/omarchy-phone.conf (or run once with
# `systemd-tmpfiles --create omarchy-phone.conf` after adding it).
#
# /run/omarchy-phone/faillock: pam_faillock's tally directory for the lock
# screen's PIN (see shell/system/pam/ophone-lock). The default
# /run/faillock is root:root 0755, and this PAM stack runs with the
# privileges of the caller -- the shell, running as the phone's session
# user, not root -- so pam_faillock can't create its per-user tally file
# there; it would silently do nothing instead of throttling. This directory
# needs to be writable by that session user. Replace "omarchy" below if the
# image uses a different session username (see docs/shell/DESIGN.md
# "Lock screen PIN").
d /run/omarchy-phone 0750 root omarchy -
d /run/omarchy-phone/faillock 0770 root omarchy -

# /etc/omarchy-phone: holds pin-hash (root:omarchy 0640, written by
# `sudo ophone-pin set`, never committed to the image build -- provisioned
# per device). The directory itself is created here so a fresh image has
# somewhere for that command to write into; it ships empty (no PIN
# configured) until someone runs the command, and the shell boots unlocked
# until they do (see Phone.qml pinConfigured / F4 in the security review).
d /etc/omarchy-phone 0750 root omarchy -
