; Local test extensions only. Passwords are throwaway values for this container.
[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

[ep](!)
type=endpoint
context=sipbed
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733
moh_passthrough=yes

[auth](!)
type=auth
auth_type=userpass

[aor](!)
type=aor
max_contacts=1
remove_existing=yes

[1001](ep)
auth=1001
aors=1001
callerid="Alice" <+12125550101>
[1001](auth)
username=1001
password=sipbed-test-only
[1001](aor)

